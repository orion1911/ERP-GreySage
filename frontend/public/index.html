<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/assets/favicon/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/assets/favicon/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/assets/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/favicon/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#1B2B52" />
  <meta name="description" content="GREYSAGE Admin" />
  <title>GREYSAGE Admin</title>
  <!--
    Paint the persisted-theme background before React mounts so an F5/refresh on
    any page shows the themed colour instantly (no white/animation flash). The
    3D login background now lives inside React (<ThreeBackground/>) and only
    mounts on the auth pages, drawing on top of this base colour.
  -->
  <script>
    (function () {
      try {
        var dm = localStorage.getItem('darkMode');
        var dark = dm === null ? true : JSON.parse(dm) === true;
        document.documentElement.style.backgroundColor =
          dark ? 'hsl(230, 62%, 14%)' : 'hsl(222deg 83.33% 97.65%)';
      } catch (e) {
        document.documentElement.style.backgroundColor = 'hsl(230, 62%, 14%)';
      }
    })();
  </script>
  <style>
  html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
}
  </style>
</head>
<body style="margin: 0;">
  <div id="root"></div>
</body>
</html>
